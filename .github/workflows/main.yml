name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build APK
        run: |
          buildozer init
          sed -i 's/^title = .*/title = Pars Mobile/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = parsmobile/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParsMobile-APK
          path: bin/*.apk
